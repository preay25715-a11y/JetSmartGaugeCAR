; Smart Gauge for Toyota / Honda / Isuzu / Mitsubishi / Nissan / Mazda - ESP32 CYD (ESP32-2432S028R)
; Flat layout: main.cpp, ui_assets.h and partitions.csv sit next to this file (no src folder needed)
; Each board has two images: the gauge (env cyd / cyd_st7789) and the Wi-Fi updater (env *_upd, same source with -DUPD_BUILD).
; The updater reads releases from github.com/<UPD_OWNER>/<UPD_REPO> (defaults are in main.cpp; override with the two flags below).
[platformio]
src_dir = .

[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
build_src_filter = -<*> +<main.cpp>
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DCORE_DEBUG_LEVEL=0
  ; CRP signal input: GPIO35 (P3 connector), divider ratio (Rtop+Rbottom)/Rbottom
  -DCRP_PIN=35
  -DCRP_RATIO=3.0f
  ; GitHub repository that holds the Releases (must be PUBLIC so the gauge can read it without a token)
  ; -DUPD_OWNER=\"preay25715-a11y\"
  ; -DUPD_REPO=\"JetSmartGaugeCAR\"

; Most CYD boards (one USB port, ILI9341)
[env:cyd]
extends = common
build_flags =
  ${common.build_flags}
  -DILI9341_2_DRIVER=1

; CYD with two USB ports (ST7789). Colours inverted (white background)? Tap the screen once on the logo
; screen after flashing, or use Setup > COLORS STD/INV - no build flag needed any more
[env:cyd_st7789]
extends = common
build_flags =
  ${common.build_flags}
  -DST7789_DRIVER=1
  -DTFT_INVERSION_ON=1

; Wi-Fi updater images (flashed to ota_1; the gauge restarts into it from Setup > Update)
[env:cyd_upd]
extends = env:cyd
build_flags =
  ${env:cyd.build_flags}
  -DUPD_BUILD=1

[env:cyd_st7789_upd]
extends = env:cyd_st7789
build_flags =
  ${env:cyd_st7789.build_flags}
  -DUPD_BUILD=1
