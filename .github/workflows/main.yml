name: Build firmware
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [cyd, cyd_st7789]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio "esptool<5"
      - run: pio run -e ${{ matrix.env }}
      - name: Merge into one flashable .bin
        run: |
          B=.pio/build/${{ matrix.env }}
          BOOT=$(find ~/.platformio -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge_bin -o mazda2-gauge-${{ matrix.env }}.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: mazda2-gauge-${{ matrix.env }}
          path: mazda2-gauge-${{ matrix.env }}.bin
